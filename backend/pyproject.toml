[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abiqua-voice-rag-backend"
version = "0.1.0"
description = "Backend for Abiqua Collection Voice RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "fastapi",
    "llama-index-core",
    "llama-index-embeddings-openai",
    "llama-index-vector-stores-mongodb",
    "openai",
    "pydantic-settings",
    "pymongo",
    "uvicorn[standard]",
]

[tool.uv]
package = false
dev-dependencies = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
addopts = "-p asyncio"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]